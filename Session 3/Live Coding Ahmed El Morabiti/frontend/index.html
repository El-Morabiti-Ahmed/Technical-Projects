<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Spartel Blog</title>
    <!-- Simplified Tailwind CSS import via CDN for learning -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Primary color configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { 50: '#f0f6ff', 500: '#2673e8', 600: '#1c5bba', 900: '#0a2042' } }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden">

    <div class="h-16 w-64 bg-green-500 text-white fixed bottom-1 right-1 rounded-lg p-4 hidden successT">Added Succussfully!</div>
    <!-- SIDEBAR -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex">
        <div class="p-6 border-b border-gray-800">
            <h2 class="text-xl font-bold">Admin Games</h2>
            <p class="text-xs text-primary-500 mt-1 uppercase font-semibold tracking-wider">Sprint 1</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block px-4 py-2 rounded text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">Dashboard</a>
            <a href="#" class="block px-4 py-2 rounded text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">Articles</a>
            <!-- Active link -->
            <a href="#" class="block px-4 py-2 rounded bg-primary-600 text-white font-medium">Games</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- HEADER -->
        <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-6">
            <div class="font-medium text-gray-600">
                Games Management
            </div>
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold">Admin</span>
            </div>
        </header>

        <!-- WORKSPACE (Main) -->
        <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
            <div class="max-w-5xl mx-auto space-y-8">
                
                <!-- SECTION 1: PAGE HEADER -->
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Games</h1>
                        <p class="text-sm text-gray-500">Organize your blog's games.</p>
                    </div>
                    <!-- Button to show the form -->
                    <button id="btn-show-form" class="bg-primary-600 text-white px-4 py-2 rounded shadow hover:bg-primary-700 transition">
                        + New Game
                    </button>
                </div>

                <!-- SECTION 2: ADD/EDIT FORM (Hidden by default) -->
                <div id="section-form" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200" hidden>
                    <h2 class="text-lg font-bold mb-4">Add a Game</h2>
                    <form id="form" class="space-y-4">
                        <!-- Hidden field for ID -->
                        <input type="hidden" id="game-id" value="">
                        
                        <!-- Name Field -->
                        <div>
                            <label for="game-name" class="block text-sm font-semibold text-gray-700 mb-1">Game Name</label>
                            <input type="text" id="game-name" required placeholder="Ex: Elden Ring" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                        </div>

                        <!-- Platform Field -->
                        <div>
                            <label for="game-platform" class="block text-sm font-semibold text-gray-700 mb-1">Platform</label>
                            <select id="game-platform" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                                <option value="">-- Choose a platform --</option>
                                <option value="PC">PC</option>
                                <option value="PlayStation">PlayStation</option>
                                <option value="Xbox">Xbox</option>
                                <option value="Nintendo Switch">Nintendo Switch</option>
                                <option value="Mobile">Mobile</option>
                            </select>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex justify-end gap-2 mt-4">
                            <button type="button" id="btn-cancel-form" class="px-4 py-2 text-gray-600 border border-gray-300 rounded hover:bg-gray-100 transition">
                                Cancel
                            </button>
                            <button type="submit" id="submitbtn" class="px-4 py-2 bg-primary-600 text-white rounded hover:bg-primary-700 transition">
                                Save
                            </button>
                        </div>
                    </form>
                </div>

                <!-- SECTION 3: GAMES LIST -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">ID</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">Name</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">Platform</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-games-body" class="divide-y divide-gray-100">
                            <!-- Data will be injected here by JavaScript -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- SPA Script -->
    <script src="main.js"></script>
</body>
</html>
